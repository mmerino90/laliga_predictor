name: Daily predictions

# Downloads the latest results and fixtures, re-runs the pipeline and publishes
# the site to GitHub Pages. Nothing is committed back to the repository.
on:
  schedule:
    - cron: "0 7 * * *"   # every day, 07:00 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # The log of predictions published before kick-off lives on the deployed site, not in git
      - name: Restore the live prediction log
        run: |
          url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/predictions_log.json"
          curl -fsSL "$url" -o /tmp/log.json && mv /tmp/log.json site/predictions_log.json || echo "No deployed log yet, using the committed one"
      - run: python run.py --update
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
